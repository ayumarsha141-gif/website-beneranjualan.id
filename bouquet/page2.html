<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produk Bouquet</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="container">
            <h1 class="logo">Beneranjualan.id</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="page2.html">Produk</a>
        </nav>
        </div>
    </header>

<main class="container">

    <section>
        <h2 class="section-title">Daftar Bouquet</h2>
        <div class="produk-grid">
        <div class="produk">
        <img src="images/Suflosha.jpeg" alt="Suflosha Bouquet">

        <h3>Suflosha Bouquet</h3>
        <p>Rp90.000</p>
        </div>

        <div class="produk">
        <img src="images/Valencia.png" alt="Valencia Bloom Box">
        <h3>Valencia Bloom Box</h3>
        <p>Rp170.000</p>

        </div>
        </div>
    </section>
<section class="form-section">

    <form>
        <h3>Form Pemesanan Bouquet</h3>

        <label for="nama">Nama</label>
        <input type="text" id="nama" required>

        <label for="email">Email</label>
        <input type="email" id="email" required>


        <label for="jumlah">Jumlah Pesanan</label>
        <input type="number" id="jumlah" required>


        <label for="tanggal">Tanggal Kirim</label>
        <input type="date" id="tanggal">

        <button type="submit">Pesan Sekarang</button>
    </form>

</section>
</main>
